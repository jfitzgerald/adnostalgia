<div class="header-inner">
  <a class="wordmark" href="{{ "/" | relURL }}" aria-label="Ad Nostalgia home">
    <span class="wordmark-mark" aria-hidden="true">AN</span>
    <span class="wordmark-copy">
      <span class="wordmark-name">Ad Nostalgia</span>
      <span class="wordmark-subtitle">Southern California Travel Archive</span>
    </span>
  </a>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>About</a>
    <a href="{{ "/gallery/" | relURL }}"{{ if eq .Section "gallery" }} aria-current="page"{{ end }}>Collection <span class="nav-count">{{ len (where .Site.RegularPages "Section" "gallery") }}</span></a>
  </nav>
</div>
